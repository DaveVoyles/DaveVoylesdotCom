<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="How davevoyles.com is built — Markdown in, static site out (workflow diagram)"><style>svg,
    svg{
      --bg: #020617;
      --grid: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      
      --text-faint: #7d8da1;

      --panel: rgba(15, 23, 42, 0.5);
      --panel-border: #1e293b;
      --lane-fill: rgba(15, 23, 42, 0.22);
      --lane-stroke: #334155;

      --arrow: #64748b;
      --arrow-emphasis: #34d399;

      
      --mask: #0f172a;

      --frontend-fill:    rgba(8, 51, 68, 0.4);
      --frontend-stroke:  #22d3ee;
      --backend-fill:     rgba(6, 78, 59, 0.4);
      --backend-stroke:   #34d399;
      --database-fill:    rgba(76, 29, 149, 0.4);
      --database-stroke:  #a78bfa;
      --cloud-fill:       rgba(120, 53, 15, 0.3);
      --cloud-stroke:     #fbbf24;
      --security-fill:    rgba(136, 19, 55, 0.4);
      --security-stroke:  #fb7185;
      --messagebus-fill:  rgba(251, 146, 60, 0.3);
      --messagebus-stroke:#fb923c;
      --external-fill:    rgba(30, 41, 59, 0.5);
      --external-stroke:  #94a3b8;

      --toolbar-bg:       rgba(15, 23, 42, 0.8);
      --toolbar-border:   #334155;
      --toolbar-text:     #e2e8f0;
      --toolbar-hover:    rgba(15, 23, 42, 0.95);
      --toolbar-menu-bg:  #0f172a;
    }
svg{
      width: 100%;
      min-width: min(900px, 100%);
      display: block;
    }
.c-grid{ stroke: var(--grid); fill: none; }
.c-mask{ fill: var(--mask); stroke: none; }
.c-frontend{ fill: var(--frontend-fill);   stroke: var(--frontend-stroke); }
.c-backend{ fill: var(--backend-fill);    stroke: var(--backend-stroke); }
.c-database{ fill: var(--database-fill);   stroke: var(--database-stroke); }
.c-cloud{ fill: var(--cloud-fill);      stroke: var(--cloud-stroke); }
.c-security{ fill: var(--security-fill);   stroke: var(--security-stroke); }
.c-messagebus{ fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
.c-external{ fill: var(--external-fill);   stroke: var(--external-stroke); }
.t-primary{ fill: var(--text); }
.t-muted{ fill: var(--text-muted); }
.t-dim{ fill: var(--text-dim); }
.t-frontend{ fill: var(--frontend-stroke); }
.t-backend{ fill: var(--backend-stroke); }
.t-database{ fill: var(--database-stroke); }
.t-cloud{ fill: var(--cloud-stroke); }
.t-security{ fill: var(--security-stroke); }
.t-messagebus{ fill: var(--messagebus-stroke); }
.t-external{ fill: var(--external-stroke); }
.a-default{ stroke: var(--arrow); fill: none; }
.a-emphasis{ stroke: var(--arrow-emphasis); fill: none; }
.a-security{ stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
.a-dashed{ stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4; }
.m-default{ fill: var(--arrow); }
.m-emphasis{ fill: var(--arrow-emphasis); }
.m-security{ fill: var(--security-stroke); }
.m-dashed{ fill: var(--database-stroke); }
.c-security-group{ fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
.c-region{ fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8,4; }
.c-lane{ fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
svg[data-animation="trace"] [data-animate="edge"]{
      stroke-dasharray: 10 8;
      stroke-dashoffset: 54;
      animation: archify-edge-flow 2.4s linear infinite;
      animation-delay: calc(var(--step, 0) * 160ms);
    }
svg[data-animation="trace"] [data-animate="node"]{
      transform-box: fill-box;
      transform-origin: center;
      animation: archify-node-pulse 3.6s ease-in-out infinite;
      animation-delay: calc(var(--step, 0) * 160ms);
    }</style><rect width="100%" height="100%" fill="var(--bg, #0a0e14)"/>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Swimlanes -->
        <rect x="40" y="52" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="74" class="t-dim" font-size="10" font-weight="600">01 / Write</text>

        <rect x="40" y="176" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="198" class="t-dim" font-size="10" font-weight="600">02 / Build</text>

        <rect x="40" y="300" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="322" class="t-dim" font-size="10" font-weight="600">03 / Deploy</text>

        <!-- Phase headers -->


        <!-- Workflow groups -->


        <!-- Edge paths -->
        <path d="M 88 145 L 88 166 L 220 166 L 220 217" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 266 243 L 384 243" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 430 269 L 430 290 L 430 290 L 430 341" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 476 367 L 579 367" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="88" y="114" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Markdown post</text>
        <text x="88" y="131" class="t-muted" font-size="8" text-anchor="middle">content/posts</text>

        <rect x="174" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="174" y="217" width="92" height="52" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="220" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">make check</text>
        <text x="220" y="255" class="t-muted" font-size="8" text-anchor="middle">content gates</text>

        <rect x="384" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="384" y="217" width="92" height="52" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="430" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Hugo build</text>
        <text x="430" y="255" class="t-muted" font-size="8" text-anchor="middle">PaperMod + layouts</text>

        <rect x="384" y="341" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="384" y="341" width="92" height="52" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="430" y="362" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">GitHub Pages</text>
        <text x="430" y="379" class="t-muted" font-size="8" text-anchor="middle">hugo.yml deploy</text>

        <rect x="579" y="341" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="579" y="341" width="92" height="52" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="625" y="362" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Reader</text>
        <text x="625" y="379" class="t-muted" font-size="8" text-anchor="middle">davevoyles.com</text>

        <!-- Edge labels -->





      </svg>