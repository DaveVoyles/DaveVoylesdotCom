<!doctype html>
<!-- Figure template. Copy, replace the text, render with render.mjs.
     Design at 800 CSS px wide, export at 2x. Roles: human, verified, review,
     blocked, infra, agent. Every box carries a .tag label so colour is never
     the only signal. Remove roles you do not use. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/extended/00-tokens.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="fig">
  <h1>One claim, stated flat</h1>
  <p class="sub">One line on what the reader should see.</p>

  <div class="cols">
    <div class="panel blocked">
      <div class="head">Before</div>
      <div class="n agent"><span class="tag">Agent</span><div class="t">Step one</div></div>
      <div class="ar">↓</div>
      <div class="n infra"><span class="tag">Infra</span><div class="t">Step two</div><div class="d">A short detail</div></div>
      <div class="ar">↓</div>
      <div class="n blocked"><span class="tag">Blocked</span><div class="t">Bad outcome</div></div>
    </div>
    <div class="panel verified">
      <div class="head">After</div>
      <div class="n agent"><span class="tag">Agent</span><div class="t">Step one</div></div>
      <div class="ar">↓</div>
      <div class="n review"><span class="tag">Review</span><div class="t">Step two</div><div class="d">A short detail</div></div>
      <div class="ar">↓</div>
      <div class="n verified"><span class="tag">Verified</span><div class="t">Good outcome</div></div>
    </div>
  </div>
  <p class="note">The rule, in the post's own words.</p>
</div>
</body>
</html>
