<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Layer stack</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* KNOBS (CSS): palette and faces. 1rem = 1u = 1% of the short side; the film lives in a 100u wide stage (100u tall square, taller at 4:5). */
  :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --dim:#8b949e; --accent:#22d3ee; --u:10px;
    --display:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  html { font-size:var(--u); }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--fg); font-family:var(--display); -webkit-font-smoothing:antialiased; }
  #stage { position:absolute; overflow:hidden; background:var(--bg); }
  /* the isometric scene: orthographic (no perspective), so label anchors are plain maths */
  #scene { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .pl { position:absolute; transform-style:preserve-3d; }
  .tp { position:absolute; inset:0; box-sizing:border-box; border:.28rem solid; border-radius:1rem; transform:translateZ(0); overflow:hidden; }
  .tp svg { position:absolute; inset:0; width:100%; height:100%; }
  .sS { position:absolute; left:0; top:100%; width:100%; transform-origin:0 0; transform:rotateX(-90deg) translateZ(0); }
  .sW { position:absolute; top:0; height:100%; transform-origin:100% 50%; transform:rotateY(-90deg) translateZ(0); }
  #ov { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .lb { position:absolute; white-space:nowrap; pointer-events:none; }
  .lb .nm { font-weight:700; letter-spacing:-.02em; line-height:1.1; }
  .lb .dt, .lb .mt { font-family:var(--mono); color:#a9b4c0; line-height:1.25; white-space:normal; }
  .lb .mt { position:absolute; left:0; top:0; white-space:nowrap; color:var(--fg); }
  .lb .mt b { color:var(--accent); font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  #dot { position:absolute; border-radius:50%; background:var(--accent); box-shadow:0 0 2.2rem rgba(34,211,238,.7); }
  #ex { position:absolute; font-size:3rem; color:var(--dim); white-space:nowrap; }
  #hit { position:absolute; z-index:5; touch-action:none; cursor:ns-resize; }
</style>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="parts.js"></script>
<script>
// KNOBS (JS): all copy, data and timing. The product, layers and the 86% figure are made up: replace them with approved content.
const CONFIG = M.cfg({
  // top of the stack first. icon picks the drawing on the plate (ui api svc data infra); detail is one short mono line.
  layers: [
    { name: "UI",       detail: "web + mobile",   icon: "ui" },
    { name: "API",      detail: "auth + limits", icon: "api" },
    { name: "Services", detail: "orders, pay",    icon: "svc" },
    { name: "Data",     detail: "SQL + cache",        icon: "data" },
    { name: "Infra",    detail: "pods + network",     icon: "infra" },
  ],
  highlight: 3,                         // index into layers (top first) of the one the post is about
  metric: { to: 86, suffix: "%", text: "of latency", note: "Example data" },
  // hook caption: shown at 0 and again from `back`, as ONE element, so the loop seam is one identical frame.
  hook: { text: "5 layers. One app.", out: 1.45, back: 14.3 },
  // captions, one per beat:
  beats: [
    { t: 1.7,  out: 4.6,  text: "Pull them apart." },
    { t: 4.9,  out: 8.0,  text: "Follow one request." },
    { t: 8.3,  out: 12.0, text: 'Slow part: <span style="color:var(--accent)">data</span>' },
    { t: 12.3, out: 14.2, text: "Fix the right layer." },
  ],
  lift:   { start: 1.7, every: 0.4, dur: 0.9, labelLag: 0.45, labelOut: 12.0 },   // layers lift top first; labels follow each lift
  settle: { start: 12.3, every: 0.2, dur: 0.9 },                                   // and drop back bottom first
  request: { start: 5.0, hops: [5.1, 5.7, 6.3, 6.9], fadeOut: 11.4 },             // the dot lands on layers 0..3 at these times, then dwells on the last
  focus: { t: 8.3, dur: 0.7, out: 12.0, extraLift: 1.4, countStart: 8.9, countDur: 1.1 },
  peek: { t: 0.1, every: 0.08, dur: 0.95 },
  duration: 15,
  // geometry, in u (1% of the short side). tall = the 4:5 re-flow, which uses the extra height for more separation
  sq:   { S: 34, G: 12,   g: 2,   T: 1.7, tilt: 70, cx: 30.2, cy: 58, capY: 5.6,  capSize: 7.9, lx: 57.5, nm: 4.8, dt: 3.8, k: 1.3,  hit: [3, 24, 54, 68] },
  tall: { S: 34, G: 17.5, g: 2.2, T: 1.8, tilt: 70, cx: 30.2, cy: 70, capY: 13, capSize: 8.2, lx: 57.5, nm: 5.4, dt: 3.8, k: 1.04, hit: [3, 26, 57, 96] },
});

const { prog, ease, lerp, spring } = M, C = CONFIG;
const set = (el, o) => Object.assign(el.style, o);
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const stage = document.getElementById("stage");
const U0 = M.dims().u;                              // sizes handed to parts.js are px, taken at load (the live page reloads on resize)
const tall = innerHeight > innerWidth * 1.05, L = tall ? C.tall : C.sq;
const N = C.layers.length, hl = C.highlight;
const A = (L.tilt * Math.PI) / 180;

// ---- colour helpers: plates stay opaque (opacity would flatten the 3D), so dimming is a mix toward the background ----
const BG = M.hex("#0d1117"), CY = M.hex("#22d3ee");
const mix = (a, b, k) => a.map((v, i) => lerp(v, b[i], k)), css = (c) => M.rgb(c);
const TOP = M.hex("#1d2530"), EDGE = M.hex("#6a7685"), SIDES = M.hex("#27313f"), SIDEW = M.hex("#323f50");

// ---- plate drawings: a 100 x 100 SVG laid on the top face, one per icon ----
const sw = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  ui:    `<rect x="18" y="26" width="64" height="48" rx="5" ${sw}/><path d="M18 38H82" ${sw}/><circle cx="26" cy="32" r="1.6" fill="currentColor"/><circle cx="32" cy="32" r="1.6" fill="currentColor"/><rect x="26" y="46" width="22" height="20" rx="3" fill="currentColor" opacity=".55"/><path d="M56 48H74M56 56H74M56 64H68" ${sw}/>`,
  api:   `<g ${sw}><rect x="20" y="22" width="60" height="12" rx="6"/><rect x="20" y="44" width="60" height="12" rx="6"/><rect x="20" y="66" width="60" height="12" rx="6"/></g><circle cx="28" cy="28" r="2.6" fill="currentColor"/><circle cx="28" cy="50" r="2.6" fill="currentColor"/><circle cx="28" cy="72" r="2.6" fill="currentColor"/><path d="M60 28H72M60 50H72M60 72H72" ${sw}/>`,
  svc:   `<g ${sw}><rect x="20" y="24" width="26" height="22" rx="4"/><rect x="54" y="24" width="26" height="22" rx="4"/><rect x="20" y="54" width="26" height="22" rx="4"/><rect x="54" y="54" width="26" height="22" rx="4"/></g><path d="M46 35H54M33 46V54M67 46V54M46 65H54" ${sw} opacity=".6"/>`,
  data:  `<g transform="translate(-10 10)"><g ${sw}><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="17"/></g><circle cx="50" cy="50" r="6" fill="currentColor"/><path d="M50 50L68 38" ${sw}/><circle class="rip" cx="50" cy="50" r="28" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0"/></g>`,
  infra: `<g ${sw}><rect x="20" y="22" width="60" height="14" rx="3"/><rect x="20" y="43" width="60" height="14" rx="3"/><rect x="20" y="64" width="60" height="14" rx="3"/></g><circle cx="29" cy="29" r="2.2" fill="currentColor"/><circle cx="29" cy="50" r="2.2" fill="currentColor"/><circle cx="29" cy="71" r="2.2" fill="currentColor"/><path d="M58 29H72M58 50H72M58 71H72" ${sw} opacity=".6"/>`,
};

// ---- scene + plates (index i = 0 bottom ... N-1 top) ----
const scene = $('<div id="scene"></div>'); stage.append(scene);
const plates = C.layers.map((ly, j) => {
  const i = N - 1 - j;
  const el = $(`<div class="pl"><div class="tp" style="color:#c9d4e0"><svg viewBox="0 0 100 100">${ICONS[ly.icon]}</svg></div><div class="sS"></div><div class="sW"></div></div>`);
  scene.append(el);
  return { j, i, el, tp: el.children[0], sS: el.children[1], sW: el.children[2], rip: el.querySelector(".rip") };
});

// ---- overlay: leader lines, request dot ----
const ov = document.createElementNS("http://www.w3.org/2000/svg", "svg"); ov.id = "ov"; stage.append(ov);
const leaders = C.layers.map((ly, j) => {
  const path = document.createElementNS(ov.namespaceURI, "path");
  set(path, { fill: "none", strokeLinecap: "round", strokeLinejoin: "round" }); path.setAttribute("pathLength", "1"); path.setAttribute("stroke-dasharray", "1 1");
  const pin = document.createElementNS(ov.namespaceURI, "circle");
  const trail = document.createElementNS(ov.namespaceURI, "line");
  ov.append(path, pin); if (j === 0) ov.append(trail);
  return { path, pin, trail };
});
const trail = leaders[0].trail; trail.setAttribute("stroke", "#22d3ee"); trail.setAttribute("stroke-linecap", "round");
const dot = $('<div id="dot"></div>'); stage.append(dot);

// ---- labels ----
const labels = C.layers.map((ly, j) => {
  const mt = j === hl ? `<div class="mt"><b class="num"></b> <span>${M.safe(C.metric.text)}</span></div>` : "";
  const el = $(`<div class="lb"><div class="nm">${M.safe(ly.name)}</div><div class="dt">${M.safe(ly.detail)}</div>${mt}</div>`);
  stage.append(el);
  const cu = j === hl ? Parts.countUp(el.querySelector(".num"), { to: C.metric.to, start: C.focus.countStart, dur: C.focus.countDur, suffix: C.metric.suffix }) : null;
  return { el, cu, dt: el.querySelector(".dt"), mt: el.querySelector(".mt") };
});
const ex = $(`<div id="ex">${M.safe(C.metric.note)}</div>`); stage.append(ex);

// ---- captions (parts.js) ----
const capOpts = { parent: stage, x: 5.6 * U0, y: L.capY * U0, size: L.capSize * U0, dur: 0.6 };
const caps = Parts.beatCaption({ ...capOpts, beats: C.beats });
const hook = Parts.beatCaption({ ...capOpts, beats: [{ t: -1, text: C.hook.text }] });   // one element: its rise is driven below

// ---- LIVE ONLY: hover or drag the stack to explode it. Renders (?render=1) never run this block. ----
let live = () => 0;
/* live-play:start */
if (!new URLSearchParams(location.search).has("render")) {
  const hit = $('<div id="hit" data-no-scrub></div>'); stage.append(hit);
  set(hit, { left: L.hit[0] + "rem", top: L.hit[1] + "rem", width: L.hit[2] + "rem", height: L.hit[3] + "rem" });
  let target = 0, cur = 0, last = null, drag = null, over = false;
  hit.addEventListener("pointerenter", () => { over = true; if (!drag) target = 1; });
  hit.addEventListener("pointerleave", () => { over = false; if (!drag) target = 0; });
  hit.addEventListener("pointerdown", (e) => { drag = { y: e.clientY, base: target }; try { hit.setPointerCapture(e.pointerId); } catch (_) {} });
  addEventListener("pointermove", (e) => { if (drag) target = M.clamp(drag.base + (drag.y - e.clientY) / (28 * U0)); });
  const up = () => { if (drag) { drag = null; target = over ? 1 : 0; } };
  addEventListener("pointerup", up); addEventListener("pointercancel", up);
  addEventListener("resize", () => location.reload());
  live = () => {
    const now = performance.now() / 1000, dt = last == null ? 0 : Math.min(0.1, now - last); last = now;
    cur += (target - cur) * (1 - Math.exp(-dt * 6));
    return cur;
  };
}
/* live-play:end */

const DOT = 0.1 * L.S;   // the dot rides a point toward the front of each plate, where the plate above does not cover it
const D = C.duration, TAU = Math.PI * 2;
M.film({ duration: D, poster: 10.4, render(t) {
  const { W, H, u } = M.dims();
  set(stage, { width: 100 * u + "px", height: H + "px", left: Math.round((W - 100 * u) / 2) + "px", top: "0px" });
  const ph = t / D, theta = -45 + 11 * Math.pow(Math.sin(Math.PI * ph), 2) + 9 * Math.pow(Math.sin(Math.PI * prog(t, 0, 1.7)), 2), th = (theta * Math.PI) / 180;
  const sinA = Math.sin(A), cosA = Math.cos(A);
  const hv = live();

  // focus: the highlighted layer lifts a touch more and everything else dims
  const f = ease.outCubic(prog(t, C.focus.t, C.focus.t + C.focus.dur)) * (1 - ease.inCubic(prog(t, C.focus.out, C.focus.out + 0.5)));

  // per-layer explode amount e (0 flat, 1 apart): top lifts first, bottom settles first. Hover on the live page raises it to 1.
  const e = plates.map((p) => {
    const a = C.lift.start + p.j * C.lift.every, s = C.settle.start + (N - 1 - p.j) * C.settle.every;
    const tl = spring(prog(t, a, a + C.lift.dur), 0.8, 10) * (1 - ease.inOut(prog(t, s, s + C.settle.dur)));
    const hvk = M.clamp(hv * 1.5 - p.j * 0.1);
    const pk = 0.32 * Math.pow(Math.sin(Math.PI * prog(t, C.peek.t + p.j * C.peek.every, C.peek.t + p.j * C.peek.every + C.peek.dur)), 2);   // hook: the slab breathes apart a hair
    p.base = Math.max(tl, ease.outCubic(hvk));   // without the hook's peek: drives the slab's scale and slide
    return Math.max(p.base, pk);
  });
  // the slab sits centred for the hook, then slides left to make room for the labels as the top layer lifts
  const cxN = lerp(50, L.cx, ease.outCubic(M.clamp(plates[0].base * 1.6)));
  const sc = lerp(1.4, 1, ease.outCubic(M.clamp(plates[0].base * 1.6)));   // the slab starts big for the hook
  const proj = (x, y, z) => { const xp = x * Math.cos(th) - y * Math.sin(th), yp = x * Math.sin(th) + y * Math.cos(th); return [cxN + xp * sc, L.cy + (yp * cosA - z * sinA) * sc]; };
  set(scene, { left: cxN * u + "px", top: L.cy * u + "px", transform: `scale(${sc}) rotateX(${L.tilt}deg) rotateZ(${theta}deg)` });
  const zOf = (p) => { const k = (p.i - (N - 1) / 2); return lerp(k * L.g, k * L.G, e[p.j]) + (p.j === hl ? C.focus.extraLift * f : 0) + 0.8 * e[p.j] * Math.sin(TAU * (3 * ph + p.i / N)); };   // a slow float, whole cycles per loop

  // request dot: hops down layer to layer (top = index 0), dwells on the highlighted one, then fades
  const R = C.request, rs = R.hops;
  let dotY = null, hop = -1, ringT = 0;
  if (t >= R.start - 0.3) {
    let k = 0; for (let h = 0; h < rs.length; h++) if (t >= rs[h]) k = h;
    const a = k, b = Math.min(k + 1, rs.length - 1), hopDur = 0.4;
    const mv = ease.inOut(prog(t, rs[b] - hopDur, rs[b]));
    const pos = (idx) => proj(-DOT, DOT, zOf(plates[idx]));
    const from = pos(a), to = pos(b), q = b === a ? 0 : (t < rs[b] - hopDur ? 0 : mv);
    dotY = [lerp(from[0], to[0], q), lerp(from[1], to[1], q)];
  }
  const dotVis = prog(t, R.start - 0.3, R.start) * (1 - ease.inCubic(prog(t, R.fadeOut, R.fadeOut + 0.5)));

  plates.forEach((p) => {
    const z = zOf(p), isF = p.j === hl;
    const dim = isF ? 0 : 0.6 * f;
    const arrive = M.pulse(t, rs[p.j] ?? -9, 0.1, 0.5) * dotVis;
    const hot = isF ? f : arrive;
    const topC = mix(mix(TOP, BG, dim), [12, 58, 68], isF ? f * 0.85 : arrive * 0.4);
    const lineC = mix(mix(EDGE, BG, dim), CY, isF ? f : arrive);
    set(p.el, { left: -L.S / 2 * u + "px", top: -L.S / 2 * u + "px", width: L.S * u + "px", height: L.S * u + "px", transform: `translateZ(${z * u}px)` });
    set(p.tp, { background: css(topC), borderColor: css(lineC), color: css(mix([201, 212, 224], BG, dim * 0.9)), borderRadius: u + "px", borderWidth: 0.28 * u + "px",
      boxShadow: hot > 0.02 ? `0 0 ${3 * u}px rgba(34,211,238,${(0.4 * hot).toFixed(3)})` : "none" });
    set(p.sS, { height: L.T * u + "px", background: css(mix(mix(SIDES, BG, dim), [10, 90, 104], hot * 0.8)) });
    set(p.sW, { width: L.T * u + "px", left: -L.T * u + "px", background: css(mix(mix(SIDEW, BG, dim), [14, 110, 126], hot * 0.8)) });
    if (p.rip) {   // the data platter pings while the request waits on it
      const w = Math.max(0, (t - C.focus.countStart) / 1.2) % 1, on = f > 0.01 && t >= rs[rs.length - 1] ? 1 : 0;
      p.rip.setAttribute("r", String(14 + 22 * w)); p.rip.setAttribute("opacity", String(on * (1 - w) * 0.9));
    }
  });

  // labels + leaders (screen space)
  const lx = L.lx * u;
  const slots = plates.map((p) => { const k = (p.i - (N - 1) / 2); return L.cy + (-(k * L.G * sinA)) * L.k; });
  set(ov, { width: 100 * u + "px", height: H + "px" });
  plates.forEach((p) => {
    const lbl = labels[p.j], ld = leaders[p.j], isF = p.j === hl;
    const a = C.lift.start + p.j * C.lift.every + C.lift.labelLag;
    const tlv = prog(t, a, a + 0.5) * (1 - prog(t, C.lift.labelOut, C.lift.labelOut + 0.4));
    const vis = Math.max(ease.outCubic(tlv), ease.outCubic(M.clamp(hv * 1.5 - p.j * 0.1)) * (1 - prog(t, C.lift.labelOut - 0.1, C.lift.labelOut + 0.2) * 0));
    const dimL = isF ? 1 : 1 - 0.4 * f;
    const z = zOf(p) - L.T / 2, anc = proj(L.S / 2, L.S / 2, z);
    const sy = slots[p.j];
    const grow = isF ? 1 + 0.1 * f : 1;
    set(lbl.el, { left: lx + "px", top: (sy - 0.62 * L.nm) * u + "px", opacity: String(vis * dimL), transform: `translateX(${(1 - ease.outCubic(vis)) * -2 * u}px) scale(${grow})`, transformOrigin: "0 0", visibility: vis < 0.002 ? "hidden" : "visible" });
    set(lbl.el.firstChild, { fontSize: L.nm * u + "px" });
    set(lbl.dt, { fontSize: L.dt * u + "px", width: (100 - L.lx - 2) * u + "px", marginTop: 0.3 * u + "px", opacity: String(1 - f * (isF ? 1 : 0)) });
    if (lbl.mt) { set(lbl.mt, { fontSize: L.dt * u + "px", top: (L.nm * 1.1 + 0.3) * u + "px", opacity: String(f) }); lbl.mt.firstChild.style.fontSize = L.dt * (tall ? 1.3 : 1.3) * u + "px"; lbl.cu.at(t); }
    // leader: anchor on the plate's right corner -> elbow -> label
    const ax = anc[0] * u, ay = anc[1] * u, ex2 = lx - 1.4 * u, ey = sy * u;
    ld.path.setAttribute("d", `M${ax} ${ay}L${ax + 3.5 * u} ${ey}L${ex2} ${ey}`);
    set(ld.path, { stroke: isF && f > 0.01 ? "#22d3ee" : "rgba(230,237,243,.55)", strokeWidth: 0.26 * u + "px", strokeDashoffset: String(1 - ease.outCubic(vis)), opacity: String(vis * dimL) });
    ld.pin.setAttribute("cx", ax); ld.pin.setAttribute("cy", ay); ld.pin.setAttribute("r", 0.7 * u);
    ld.pin.setAttribute("fill", isF && f > 0.01 ? "#22d3ee" : "#e6edf3"); ld.pin.setAttribute("opacity", String(vis * dimL));
  });
  if (dotY) {
    const top = proj(-DOT, DOT, zOf(plates[0]));
    set(dot, { width: 2.6 * u + "px", height: 2.6 * u + "px", left: (dotY[0] - 1.3) * u + "px", top: (dotY[1] - 1.3) * u + "px", opacity: String(dotVis), visibility: dotVis < 0.002 ? "hidden" : "visible", transform: `scale(${1 + 0.35 * M.pulse(t, rs[rs.length - 1], 0.1, 0.5)})` });
    trail.setAttribute("x1", top[0] * u); trail.setAttribute("y1", top[1] * u); trail.setAttribute("x2", dotY[0] * u); trail.setAttribute("y2", dotY[1] * u);
    trail.setAttribute("stroke-width", 0.3 * u); trail.setAttribute("opacity", String(0.45 * dotVis));
  } else { set(dot, { visibility: "hidden" }); trail.setAttribute("opacity", "0"); }

  set(ex, { left: (93.5 - 22) * u + "px", width: 22 * u + "px", textAlign: "right", top: (L.capY + L.capSize * 0.5) * u + "px", opacity: String(f * 0.9) });
  caps.at(t); hook.at(t);
  const hp = Math.max(M.vis(t, -1, C.hook.out, 0.6, 0.3), M.vis(t, C.hook.back, Infinity, 0.6)), hl2 = hook.el.firstChild;
  hl2.firstChild.style.transform = `translateY(${(1 - hp) * 115}%)`; hl2.style.visibility = hp < 0.001 ? "hidden" : "visible";
} });
Parts.scrub({ color: "#22d3ee" });   // live page only: the thin bottom bar scrubs the film; dragging elsewhere scrubs too; hover/drag-up on the stack explodes it
</script>
