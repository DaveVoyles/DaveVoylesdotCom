url_label = "GitHub"
secondary_url = "https://phillylaxstats.com/"
secondary_label = "Live site"

[[params.home.projects]]
title = "CFB 26 Playbooks"
badge = "WebGL"
blurb = "Interactive WebGL playbook explorer for College Football 26 — schemes, formations, and visual learning tools."
url = "https://github.com/DaveVoyles/College-Football-26-Playbooks-site"
url_label = "GitHub"
