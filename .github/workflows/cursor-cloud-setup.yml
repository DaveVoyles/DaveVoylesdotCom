name: Cursor Cloud setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cursor-cloud-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Prove portable Cloud setup
        run: bash scripts/setup-cursor-cloud.sh
