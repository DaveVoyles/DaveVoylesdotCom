name: Cursor Cloud setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cursor-cloud-setup:
    runs-on: [self-hosted, macOS, ARM64, pr-ci, "tier:pro"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Prove portable Cloud setup
        run: bash scripts/setup-cursor-cloud.sh
