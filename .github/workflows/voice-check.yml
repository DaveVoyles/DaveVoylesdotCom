name: Voice check

# Pull requests only. Never part of `make check`, the push build or the daily
# scheduled publish. Warning mode: findings show as annotations, the job passes.
on:
  pull_request:
    paths:
      - "content/posts/**"
      - "tools/voice/**"
      - "scripts/check-voice.sh"
      - ".github/workflows/voice-check.yml"

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Voice check
        run: make check-voice
