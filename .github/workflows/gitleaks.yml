name: Gitleaks Secret Scan

# CI-owned secret-scan backstop. This repo's only defense against committed
# secrets was previously the machine-local pre-commit hook (Chat-Agents'
# scripts/enable-secret-scan.sh, symlinked per-clone) -- which fails open if
# gitleaks isn't installed and is skipped entirely by --no-verify or a fresh
# clone that never ran the scaffold script. This workflow is the
# runtime-agnostic, fail-closed layer: it runs regardless of which machine
# or agent pushed the commit. Mirrors Chat-Agents' .github/workflows/
# gitleaks.yml, adapted for a GitHub-hosted runner (no self-hosted runner
# is registered for this repo).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
