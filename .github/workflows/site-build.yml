name: Site build

# Pull requests only. Never called by the push build or the daily scheduled
# publish (hugo.yml), which stays unchanged. Renders to memory, so no artifact
# is kept: it only proves the site builds, e.g. that every post's front matter parses.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site (in memory)
        run: hugo --minify --renderToMemory
