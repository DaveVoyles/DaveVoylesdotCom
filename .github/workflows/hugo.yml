name: Hugo Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Daily rebuild so future-dated posts (draft=false, date > now) go live
  # on schedule without a manual push. Hugo excludes future content by default.
  # 14:00 UTC ≈ 10:00 ET (EDT); ~09:00 EST in winter.
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

# Least-privilege default: only the deploy job actually needs pages/id-token
# write access. A job-level `permissions:` block fully replaces (not merges
# with) this default for that job, so `deploy` declares its own below —
# review-lenses `security` flagged the build job's unpinned `apt-get install`
# step running with deploy-capable tokens it never uses (issue: PR fixing
# check-content.sh CI portability).
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Install ripgrep
        # Unpinned: an exact-version pin (13.0.0-2ubuntu0.1, confirmed present
        # in Canonical's own amd64 archive) still failed with "Version ... was
        # not found" on the real runner — this repo's CI apparently resolves
        # apt through a mirror (e.g. Azure's regional mirror for GH-hosted
        # runners) that can lag or diverge from the primary archive, and that
        # can't be fully verified from outside the runner. Unpinned trades a
        # small amount of version-drift risk for actually working; if this
        # regresses again, verify the exact mirror/version in a real Actions
        # run (not a local container) before re-attempting a pin.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Check content
        run: ./scripts/check-content.sh

      - name: Test content checks
        run: make test

      - name: Build
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"

          check_path() {
            local path="$1"
            local url="${base}${path}"
            local tag="[${path}]"
            for i in 1 2 3 4 5; do
              # `|| echo 000` keeps a connection-level curl failure (DNS not
              # yet resolvable, connection refused) from tripping the job's
              # `set -e` and aborting this path's retry loop early.
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "$tag $url responded 200 OK"
                return 0
              fi
              echo "$tag $url attempt $i: got HTTP $code, retrying in 10s..."
              sleep 10
            done
            echo "$tag $url did not return 200 after deploy" >&2
            return 1
          }

          # Run all paths concurrently so total wall-clock stays ~1 path's
          # worth of retries (~50s worst case) instead of summing serially
          # across all 6 (~300s worst case).
          # "/topics/gaming/" (plan 0002 / D6) stands in for the whole
          # /topics/<bucket>/ family -- Gaming is guaranteed non-empty (the
          # largest bucket by post count), so it's the one bucket page that
          # can never legitimately 404 as the corpus's topic assignments
          # evolve.
          paths=("/" "/tags/" "/archives/" "/search/" "/topics/gaming/" "/graph/")
          pids=()
          for path in "${paths[@]}"; do
            check_path "$path" &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
